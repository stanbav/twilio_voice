<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="IE=Edge" http-equiv="X-UA-Compatible">
    <title>Twilio Voice</title>
</head>
<body>
<!--twilio native js library-->
<script type="text/javascript" src="./twilio.min.js"></script>
<script>
// Keep track of microphone access to avoid duplicate permission requests
window.hasRequestedMicrophoneAccess = false;
window.hasMicrophoneAccess = false;

// Audio management - used for cleanup
window.activeStreams = [];

// Clean up helper to ensure all audio resources are released
window.cleanupAudioResources = function() {
  if (window.activeStreams && window.activeStreams.length > 0) {
    window.activeStreams.forEach(stream => {
      if (stream && stream.getTracks) {
        stream.getTracks().forEach(track => {
          if (track && track.stop) {
            track.stop();
          }
        });
      }
    });
    window.activeStreams = [];
  }
};

// Pre-request microphone access once to avoid duplicate popups
navigator.mediaDevices.getUserMedia({ audio: true })
  .then(stream => {
    window.hasMicrophoneAccess = true;
    window.hasRequestedMicrophoneAccess = true;
    
    // Add stream to active streams for later cleanup
    window.activeStreams.push(stream);
    
    // Stop all tracks to release the microphone
    stream.getTracks().forEach(track => track.stop());
    window.activeStreams = [];
  })
  .catch(error => {
    window.hasRequestedMicrophoneAccess = true;
  });

// Redirect console logs to postMessage
const originalConsole = {
  log: console.log,
  error: console.error,
  warn: console.warn,
  info: console.info,
  debug: console.debug
};

console.log = (...args) => {
  originalConsole.log.apply(console, args);
  window.chrome.webview.postMessage(JSON.stringify({
    type: 'log',
    level: 'debug',
    message: args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : arg).join(' ')
  }));
};

console.error = (...args) => {
  originalConsole.error.apply(console, args);
  window.chrome.webview.postMessage(JSON.stringify({
    type: 'log',
    level: 'error',
    message: args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : arg).join(' ')
  }));
};

console.warn = (...args) => {
  originalConsole.warn.apply(console, args);
  window.chrome.webview.postMessage(JSON.stringify({
    type: 'log',
    level: 'info',
    message: args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : arg).join(' ')
  }));
};

console.info = (...args) => {
  originalConsole.info.apply(console, args);
  window.chrome.webview.postMessage(JSON.stringify({
    type: 'log',
    level: 'info',
    message: args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : arg).join(' ')
  }));
};

console.debug = (...args) => {
  originalConsole.debug.apply(console, args);
  window.chrome.webview.postMessage(JSON.stringify({
    type: 'log',
    level: 'debug',
    message: args.map(arg => typeof arg === 'object' ? JSON.stringify(arg) : arg).join(' ')
  }));
};

// Log when Twilio SDK is loaded
window.addEventListener('load', () => {
  if (typeof Twilio === 'undefined') {
    console.error('Twilio SDK not loaded');
  } else {
    console.log('Twilio SDK loaded successfully');
    window.TwilioInstance = Twilio;
    window.device = null;
    
    window.chrome.webview.postMessage(JSON.stringify({
      type: 'sdk_ready',
      message: 'Twilio SDK is ready for use'
    }));
  }
});

// Function to log device state
function logDeviceState(device) {
  if (!device) {
    console.error('Device is null');
    return;
  }
  
  console.log('Device State:', {
    state: device.state,
    ready: device.ready,
    registered: device.registered,
    token: device.token,
    capabilities: device.capabilities,
    connections: device.connections,
    audio: device.audio,
    codec: device.codec,
    maxCallSignals: device.maxCallSignals,
    maxCallSignalsPerSecond: device.maxCallSignalsPerSecond
  });
}

// Function to log connection state
function logConnectionState(connection) {
  if (!connection) {
    console.error('Connection is null');
    return;
  }
  
  console.log('Connection State:', {
    state: connection.state,
    status: connection.status,
    parameters: connection.parameters,
    callSid: connection.callSid,
    from: connection.from,
    to: connection.to,
    muted: connection.muted,
    direction: connection.direction,
    timestamp: connection.timestamp,
    customParameters: connection.customParameters
  });
}

// Function to setup device event handlers
function setupDeviceHandlers(device) {
  if (!device) {
    console.error('Cannot setup handlers for null device');
    return;
  }

  device.on('ready', () => {
    console.log('Device is ready');
    logDeviceState(device);
  });

  device.on('error', (error) => {
    console.error('Device error:', error);
    window.cleanupAudioResources();
  });

  device.on('connect', (connection) => {
    console.log('New connection established');
    logConnectionState(connection);
    
    connection.on('accept', () => {
      console.log('Connection accepted');
      logConnectionState(connection);
    });

    connection.on('disconnect', () => {
      console.log('Connection disconnected');
      logConnectionState(connection);
      
      // Clean up audio resources after disconnect
      setTimeout(() => {
        window.cleanupAudioResources();
      }, 500);
    });

    connection.on('error', (error) => {
      console.error('Connection error:', error);
      window.cleanupAudioResources();
    });

    connection.on('cancel', () => {
      console.log('Connection cancelled');
      logConnectionState(connection);
      window.cleanupAudioResources();
    });

    connection.on('reject', () => {
      console.log('Connection rejected');
      logConnectionState(connection);
      window.cleanupAudioResources();
    });
  });

  device.on('disconnect', (connection) => {
    console.log('Connection disconnected from device');
    logConnectionState(connection);
    window.cleanupAudioResources();
  });
}

// Override the device setup to add logging
const originalSetup = Twilio.Device.setup;
Twilio.Device.setup = function(token, options) {
  console.log('Setting up Twilio Device with token:', token);
  
  const device = originalSetup.call(this, token, options);
  setupDeviceHandlers(device);
  
  return device;
};

// Override getUserMedia to track active streams for proper cleanup
const originalGetUserMedia = navigator.mediaDevices.getUserMedia;
navigator.mediaDevices.getUserMedia = function(constraints) {
  if (constraints.audio && window.hasRequestedMicrophoneAccess) {
    console.log('Reusing existing microphone permission');
    if (!window.hasMicrophoneAccess) {
      return Promise.reject(new DOMException('Permission denied', 'NotAllowedError'));
    }
  }
  window.hasRequestedMicrophoneAccess = true;
  return originalGetUserMedia.call(this, constraints)
    .then(stream => {
      window.hasMicrophoneAccess = true;
      // Keep track of this stream for later cleanup
      window.activeStreams.push(stream);
      return stream;
    })
    .catch(error => {
      console.error('getUserMedia error:', error);
      throw error;
    });
};

// Add a window unload handler to clean up resources
window.addEventListener('beforeunload', () => {
  window.cleanupAudioResources();
});
</script>
</body>
</html>
